[build]
  command   = "npm run build"
  publish   = "dist"

# Node version and build flags
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

# SPA fallback — all routes serve index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
